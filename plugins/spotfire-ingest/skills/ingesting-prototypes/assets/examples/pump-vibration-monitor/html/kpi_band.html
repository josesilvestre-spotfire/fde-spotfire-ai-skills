<div style="display:flex;gap:12px;padding:6px 8px;font-family:Roboto,Arial,sans-serif;">
  <div style="flex:1;border:1px solid #D9DEE7;border-radius:6px;padding:6px 10px;">
    <div style="font-size:11px;color:#5B6475;">Latest vibration (mm/s)</div>
    <div style="font-size:22px;font-weight:600;color:#1F2937;">{{control:latestVibration}}</div>
  </div>
  <div style="flex:1;border:1px solid #D9DEE7;border-radius:6px;padding:6px 10px;">
    <div style="font-size:11px;color:#5B6475;">Hours over alarm</div>
    <div style="font-size:22px;font-weight:600;color:#1F2937;">{{control:hoursOverAlarm}}</div>
  </div>
  <div style="flex:1;border:1px solid #D9DEE7;border-radius:6px;padding:6px 10px;">
    <div style="font-size:11px;color:#5B6475;">Mean flow (bbl/d)</div>
    <div style="font-size:22px;font-weight:600;color:#1F2937;">{{control:meanFlow}}</div>
  </div>
</div>
