<div style="padding:8px;font-family:Roboto,Arial,sans-serif;font-size:12px;color:#1F2937;">
  <div style="font-weight:600;margin-bottom:6px;">Pump</div>
  <div>{{control:pumpId}}</div>
  <div style="font-weight:600;margin:10px 0 6px;">Date range</div>
  <div>From {{control:windowStart}}</div>
  <div>To {{control:windowEnd}}</div>
  <div style="font-weight:600;margin:10px 0 6px;">Alarm level (mm/s)</div>
  <div>{{control:alarmLevel}}</div>
  <div style="font-weight:600;margin:10px 0 6px;">Smoothing span (h)</div>
  <div>{{control:smoothingSpan}}</div>
  <div style="font-weight:600;margin:10px 0 6px;">Forecast horizon (h)</div>
  <div>{{control:forecastHours}}</div>
  <div style="font-weight:600;margin:10px 0 6px;">Show raw readings</div>
  <div>{{control:showRaw}}</div>
</div>
