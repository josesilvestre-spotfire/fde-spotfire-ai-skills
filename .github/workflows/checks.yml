name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    # Windows: the scripts and tests were developed and proven on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install numpy pandas scipy pyyaml openpyxl
      - name: Skill spec, size, shared formats and leak patterns
        run: python scripts/check_skills.py --quiet
      - name: Generated docs are current
        run: python scripts/build_docs.py --check
      - name: Tests that do not need Spotfire
        run: python scripts/run_tests.py
